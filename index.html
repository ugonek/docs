<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Achievement Goblin — Legal</title>
<style>
  :root {
    --bg: #fbfaf8;
    --text: #262220;
    --muted: #6b625c;
    --accent: #8a4baf;
    --card: #ffffff;
    --border: #e7e1da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1815;
      --text: #f1ede8;
      --muted: #ab9f96;
      --accent: #c497e8;
      --card: #24211d;
      --border: #38332c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .card {
    max-width: 420px;
    width: 100%;
    padding: 40px 32px;
    text-align: center;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 8px;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 32px;
    font-size: 0.95rem;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.link {
    display: block;
    padding: 14px 18px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    transition: border-color 0.15s ease;
  }
  a.link:hover { border-color: var(--accent); }
  a.link span {
    display: block;
    font-weight: 400;
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 2px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Achievement Goblin</h1>
    <p class="sub">Legal documents &amp; support links for the Discord bot</p>
    <div class="links">
      <a class="link" href="terms.html">Terms of Service<span>How the bot may be used</span></a>
      <a class="link" href="privacy.html">Privacy Policy<span>What data is collected &amp; how</span></a>
      <a class="link" href="support.html">Support the Bot<span>It's free — tips are optional &amp; appreciated</span></a>
    </div>
  </div>
</body>
</html>
